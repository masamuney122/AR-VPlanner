# Proje Konfigürasyon Dosyası

# Model Ayarları
models:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  nli_model: "microsoft/deberta-v3-base"
  llm_model: "meta-llama/Llama-3.2-3B-Instruct"  # Llama 3.2 3B Instruct (chat template destekli)
  llm_type: "transformers"  # "transformers" veya "llama-cpp"
  llm_model_path: ""  # llama-cpp için yerel model yolu (opsiyonel)
  
# Vektör Deposu Ayarları
vector_store:
  dimension: 384  # all-MiniLM-L6-v2 için
  index_type: "L2"  # L2 distance
  
# API Ayarları
api:
  google_api_key: ""  # .env dosyasından yüklenecek (GOOGLE_API_KEY)
  timeout: 30
  
# Optimizasyon Ayarları
optimization:
  max_iterations: 1000
  time_limit: 60  # saniye
  
# Web Arayüzü
web:
  host: "0.0.0.0"
  port: 5001
  debug: true

# Veri Kaynakları
data_sources:
  - type: "api"
    name: "google_places"
    description: "Google Places API - Turistik yerler, restoranlar, oteller"
    enabled: true
  - type: "api"
    name: "google_maps"
    description: "Google Maps Directions API - Rota, mesafe, süre"
    enabled: true

# Itinerary Ayarları
itinerary:
  max_activities_per_day: 5
  daily_start_hour: 9       # Gün başlangıcı
  daily_end_hour: 21        # Gün bitişi
  meal_budget_per_day: 300  # TL - günlük yemek bütçesi tahmini
  transport_budget_per_day: 100  # TL - günlük ulaşım tahmini
  buffer_percentage: 10     # % - ekstra masraf tamponu





